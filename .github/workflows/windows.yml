name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les outils
        run: pip install aiohttp pynput pyinstaller
      - name: Créer l'exécutable
        run: pyinstaller --onefile --windowed --name CedricSourisPC --hidden-import pynput.mouse._win32 --hidden-import pynput.keyboard._win32 souris_pc.py
      - uses: actions/upload-artifact@v4
        with:
          name: CedricSourisPC-windows
          path: dist/CedricSourisPC.exe
